    <text x="192" y="106" font-size="6.5" fill="#64748B">for your CA</text>
    <text x="192" y="116" font-size="6.5" fill="#64748B">&amp; GSTR-1</text>
    <rect x="190" y="130" width="65" height="18" rx="3" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="222" y="142" font-size="7" font-weight="700" fill="#1D4ED8" text-anchor="middle">Download 📥</text>

