    <text x="32" y="110" font-size="7.5" font-weight="700" fill="#0F172A">AMIT SHARMA - SURAT 395007</text>
    <text x="32" y="122" font-size="7" fill="#64748B">Plot 42, Green Park Society, Ring Road</text>
    <text x="32" y="133" font-size="7" font-weight="700" fill="#2563EB">Hub: ST/SRT/HUB-04 [EXPRESS]</text>

