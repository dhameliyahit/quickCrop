      <rect x="96" y="0" width="3.5" height="30" fill="#0F172A"/>
      <rect x="102" y="0" width="2" height="30" fill="#0F172A"/>
      <rect x="107" y="0" width="4.5" height="30" fill="#0F172A"/>
      <rect x="114" y="0" width="2" height="30" fill="#0F172A"/>
      <rect x="119" y="0" width="3" height="30" fill="#0F172A"/>
      <rect x="125" y="0" width="4" height="30" fill="#0F172A"/>
      <rect x="131" y="0" width="1.5" height="30" fill="#0F172A"/>
      <rect x="135" y="0" width="3" height="30" fill="#0F172A"/>
