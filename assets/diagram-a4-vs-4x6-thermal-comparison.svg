  <text x="122" y="41" font-size="11.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">DISPATCH COMPARISON</text>
  <text x="40" y="76" font-size="22" font-weight="800" fill="#0F172A">Raw Marketplace A4 Sheet vs. QuickCrop 4×6" Thermal Label</text>
  <text x="40" y="98" font-size="13" fill="#64748B">Why printing directly from Flipkart or Amazon Seller Hub without cropping causes packaging delays and scan failures</text>

  <!-- Left: Raw A4 Page -->
