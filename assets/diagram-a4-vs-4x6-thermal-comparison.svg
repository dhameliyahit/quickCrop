      <rect x="50" y="0" width="3.5" height="30" fill="#0F172A"/>
      <rect x="56" y="0" width="1.5" height="30" fill="#0F172A"/>
      <rect x="61" y="0" width="4" height="30" fill="#0F172A"/>
      <rect x="68" y="0" width="2" height="30" fill="#0F172A"/>
      <rect x="73" y="0" width="3" height="30" fill="#0F172A"/>
      <rect x="79" y="0" width="4.5" height="30" fill="#0F172A"/>
      <rect x="86" y="0" width="1.5" height="30" fill="#0F172A"/>
