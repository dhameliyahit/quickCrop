<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2874F0"/>
      <stop offset="100%" stop-color="#1259C3"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Glow Arc -->
  <path d="M 64 220 A 180 180 0 0 1 292 52" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="8" stroke-linecap="round"/>

  <!-- Label White Card with Drop Shadow -->
  <g filter="url(#shadow)">
    <rect x="116" y="96" width="280" height="320" rx="20" fill="#FFFFFF"/>
    
    <!-- Top Header Bar on Label -->
    <rect x="136" y="116" width="240" height="28" rx="6" fill="#F1F5F9"/>
    <circle cx="154" cy="130" r="5" fill="#94A3B8"/>
    <rect x="168" y="126" width="70" height="8" rx="4" fill="#94A3B8"/>
    <rect x="310" y="126" width="50" height="8" rx="4" fill="#2874F0"/>

    <!-- Realistic EKart Vector Barcode -->
    <g fill="#0F172A">
      <rect x="144" y="160" width="10" height="68"/>
      <rect x="160" y="160" width="5" height="68"/>
      <rect x="171" y="160" width="14" height="68"/>
      <rect x="191" y="160" width="7" height="68"/>
      <rect x="204" y="160" width="4" height="68"/>
      <rect x="214" y="160" width="12" height="68"/>
      <rect x="232" y="160" width="8" height="68"/>
      <rect x="246" y="160" width="15" height="68"/>
      <rect x="267" y="160" width="5" height="68"/>
      <rect x="278" y="160" width="10" height="68"/>
      <rect x="294" y="160" width="14" height="68"/>
      <rect x="314" y="160" width="6" height="68"/>
      <rect x="326" y="160" width="16" height="68"/>
      <rect x="348" y="160" width="8" height="68"/>
    </g>
    <text x="256" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="3">FMPC0928471</text>

    <!-- Cut Line (Scissor dashed line) -->
    <line x1="130" y1="274" x2="382" y2="274" stroke="#FB641B" stroke-width="4" stroke-dasharray="10 8"/>

    <!-- Bottom Invoice Placeholder (Being removed) -->
    <rect x="140" y="294" width="110" height="10" rx="4" fill="#E2E8F0"/>
    <rect x="140" y="314" width="232" height="8" rx="4" fill="#F1F5F9"/>
    <rect x="140" y="330" width="180" height="8" rx="4" fill="#F1F5F9"/>
    <rect x="140" y="346" width="200" height="8" rx="4" fill="#F1F5F9"/>
    <rect x="140" y="374" width="90" height="12" rx="4" fill="#CBD5E1"/>
    <rect x="282" y="374" width="90" height="12" rx="4" fill="#CBD5E1"/>
  </g>

  <!-- Yellow Crop / Scissor Floating Badge -->
  <g transform="translate(346, 240)">
    <circle cx="34" cy="34" r="34" fill="#FFE500" filter="url(#shadow)"/>
    <circle cx="34" cy="34" r="34" fill="none" stroke="#2874F0" stroke-width="3"/>
    <!-- Scissor SVG Icon inside Badge -->
    <path d="M22 26 C22 23.8 23.8 22 26 22 C28.2 22 30 23.8 30 26 C30 27.6 29 29 27.6 29.6 L34 34 L40.4 29.6 C39 29 38 27.6 38 26 C38 23.8 39.8 22 42 22 C44.2 22 46 23.8 46 26 C46 28.2 44.2 30 42 30 L34 36 L42 42 C44.2 42 46 43.8 46 46 C46 48.2 44.2 50 42 50 C39.8 50 38 48.2 38 46 C38 44.4 39 43 40.4 42.4 L34 38 L27.6 42.4 C29 43 30 44.4 30 46 C30 48.2 28.2 50 26 50 C23.8 50 22 48.2 22 46 C22 43.8 23.8 42 26 42 L34 36 L26 30 C23.8 30 22 28.2 22 26 Z" fill="#0F3A82"/>
  </g>
</svg>
