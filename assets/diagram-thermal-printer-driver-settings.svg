<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="100%" height="auto" style="font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="pShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="820" height="520" rx="16" fill="url(#pBg)" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Title Badge -->
  <rect x="40" y="24" width="180" height="26" rx="13" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="130" y="41" font-size="11.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">PRINTER SETUP CHEATSHEET</text>
  <text x="40" y="76" font-size="22" font-weight="800" fill="#0F172A">Windows Thermal Barcode Printer Configuration</text>
  <text x="40" y="98" font-size="13" fill="#64748B">Recommended driver settings for TSC, TVS LP 46, Xprinter XP-420B, and Zebra direct thermal printers</text>

  <!-- Grid of 4 Settings Cards -->
  <!-- Card 1: Paper Size -->
  <g transform="translate(40, 125)">
    <rect width="355" height="150" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#pShadow)"/>
    <circle cx="30" cy="30" r="14" fill="#EFF6FF"/>
    <text x="30" y="35" font-size="12" font-weight="800" fill="#2563EB" text-anchor="middle">1</text>
    <text x="55" y="34" font-size="14" font-weight="700" fill="#0F172A">Paper / Stock Size</text>
    <rect x="250" y="20" width="85" height="22" rx="4" fill="#DCFCE7"/>
    <text x="292" y="35" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">CRITICAL</text>

    <!-- Details -->
    <rect x="20" y="55" width="315" height="40" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="32" y="73" font-size="11" font-weight="700" fill="#334155">Stock Name: 4x6" Thermal / 100mm × 150mm</text>
    <text x="32" y="87" font-size="10.5" fill="#64748B">Width: 101.6 mm (4.00")  |  Height: 152.4 mm (6.00")</text>

    <text x="20" y="115" font-size="11" fill="#475569">✓ Select "User-defined" if 4×6 is not listed in dropdown.</text>
    <text x="20" y="132" font-size="11" fill="#475569">✓ Set gap height to 2.0 mm (standard thermal roll gap).</text>
  </g>

  <!-- Card 2: Margins -->
  <g transform="translate(425, 125)">
    <rect width="355" height="150" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#pShadow)"/>
    <circle cx="30" cy="30" r="14" fill="#EFF6FF"/>
    <text x="30" y="35" font-size="12" font-weight="800" fill="#2563EB" text-anchor="middle">2</text>
    <text x="55" y="34" font-size="14" font-weight="700" fill="#0F172A">Print Margins: Zero (0 mm)</text>
    <rect x="250" y="20" width="85" height="22" rx="4" fill="#DCFCE7"/>
    <text x="292" y="35" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">MUST SET</text>

    <!-- Details -->
    <rect x="20" y="55" width="315" height="40" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="32" y="73" font-size="11" font-weight="700" fill="#334155">Top: 0.0 mm  •  Bottom: 0.0 mm</text>
    <text x="32" y="87" font-size="11" font-weight="700" fill="#334155">Left: 0.0 mm  •  Right: 0.0 mm</text>

    <text x="20" y="115" font-size="11" fill="#475569">❌ Never use "Default" or "Minimum" browser margins.</text>
    <text x="20" y="132" font-size="11" fill="#475569">✓ Setting zero margins prevents label content truncation.</text>
  </g>

  <!-- Card 3: Scaling (100% vs Fit) -->
  <g transform="translate(40, 295)">
    <rect width="355" height="150" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#pShadow)"/>
    <circle cx="30" cy="30" r="14" fill="#EFF6FF"/>
    <text x="30" y="35" font-size="12" font-weight="800" fill="#2563EB" text-anchor="middle">3</text>
    <text x="55" y="34" font-size="14" font-weight="700" fill="#0F172A">Scale: "Actual Size" (100%)</text>
    <rect x="250" y="20" width="85" height="22" rx="4" fill="#FEE2E2"/>
    <text x="292" y="35" font-size="11" font-weight="700" fill="#991B1B" text-anchor="middle">NO "FIT"</text>

    <!-- Details -->
    <rect x="20" y="55" width="315" height="40" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="32" y="73" font-size="11" font-weight="700" fill="#15803D">✓ Choose: "Actual Size" or "100%"</text>
    <text x="32" y="87" font-size="11" font-weight="700" fill="#991B1B">❌ Avoid: "Fit to Printable Area" / "Fit to Page"</text>

    <text x="20" y="115" font-size="11" fill="#475569">"Fit" shrinks the 1D barcode lines unevenly, causing Ekart</text>
    <text x="20" y="132" font-size="11" fill="#475569">and Delhivery handheld PDA laser scanners to reject pickup.</text>
  </g>

  <!-- Card 4: Print Speed & Darkness -->
  <g transform="translate(425, 295)">
    <rect width="355" height="150" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#pShadow)"/>
    <circle cx="30" cy="30" r="14" fill="#EFF6FF"/>
    <text x="30" y="35" font-size="12" font-weight="800" fill="#2563EB" text-anchor="middle">4</text>
    <text x="55" y="34" font-size="14" font-weight="700" fill="#0F172A">Darkness &amp; Print Speed</text>
    <rect x="250" y="20" width="85" height="22" rx="4" fill="#FEF3C7"/>
    <text x="292" y="35" font-size="11" font-weight="700" fill="#92400E" text-anchor="middle">QUALITY</text>

    <!-- Details -->
    <rect x="20" y="55" width="315" height="40" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="32" y="73" font-size="11" font-weight="700" fill="#334155">Darkness: 10 – 12 (Scale of 0–15)</text>
    <text x="32" y="87" font-size="11" font-weight="700" fill="#334155">Print Speed: 3.0 – 4.0 IPS (Inches Per Second)</text>

    <text x="20" y="115" font-size="11" fill="#475569">Slightly slower print speed (3–4 IPS) ensures deep black</text>
    <text x="20" y="132" font-size="11" fill="#475569">thermal contrast so barcodes don't fade in transit.</text>
  </g>

  <!-- Bottom Bar -->
  <rect x="40" y="465" width="740" height="32" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="410" y="486" font-size="11.5" fill="#334155" text-anchor="middle">📌 Validated on TSC DA210/DA220, TVS LP 46 Lite/Neo, Xprinter XP-420B, and Zebra ZD220/ZD230.</text>
</svg>
